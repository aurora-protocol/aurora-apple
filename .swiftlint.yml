# SwiftLint configuration for aurora-apple.
#
# aurora-apple is a protocol library that wraps the Go aurora-core through a
# C-archive xcframework. Thresholds below are deliberate for that shape:
# protocol code has long, explicit validation paths and the test suite drives a
# large mock surface, so the stock limits are tuned rather than silenced.

included:
  - Sources
  - Tests
  - SharedNetworkExtension
  - Apps

excluded:
  - .build
  - Vendor

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - convenience_type

disabled_rules:
  # The house style uses trailing commas in multi-line literals.
  - trailing_comma

# Protocol validation and test setup routinely exceed the stock 120 columns.
line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

# Test classes are grouped by concern; a cohesive suite is worth more than an
# arbitrary split. Source types stay well under these.
type_body_length:
  warning: 500
  error: 900

file_length:
  warning: 900
  error: 1400
  ignore_comment_only_lines: true

function_body_length:
  warning: 120
  error: 200

# Tunnel state-machine transitions branch over network path, core, and stop
# state in one place; splitting them hurts readability more than it helps.
cyclomatic_complexity:
  warning: 12
  error: 20


identifier_name:
  min_length: 2
  excluded:
    - id
    - ok

type_name:
  max_length:
    warning: 50
    error: 60

nesting:
  type_level: 2

name: AuroraApple
options:
  bundleIdPrefix: org.aurora-protocol
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  AuroraKit_iOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AuroraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.kit.ios
        PRODUCT_NAME: AuroraKit
        PRODUCT_MODULE_NAME: AuroraKit
        GENERATE_INFOPLIST_FILE: YES
  AuroraKit_macOS:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AuroraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.kit.macos
        PRODUCT_NAME: AuroraKit
        PRODUCT_MODULE_NAME: AuroraKit
        GENERATE_INFOPLIST_FILE: YES
  AuroraUI_iOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AuroraUI
    dependencies:
      - target: AuroraKit_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.ui.ios
        PRODUCT_NAME: AuroraUI
        PRODUCT_MODULE_NAME: AuroraUI
        GENERATE_INFOPLIST_FILE: YES
  AuroraUI_macOS:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AuroraUI
    dependencies:
      - target: AuroraKit_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.ui.macos
        PRODUCT_NAME: AuroraUI
        PRODUCT_MODULE_NAME: AuroraUI
        GENERATE_INFOPLIST_FILE: YES
  AuroraIOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - target: AuroraUI_iOS
      - target: AuroraPacketTunnel_iOS
        embed: true
        codeSign: true
    entitlements:
      path: Apps/iOS/AuroraIOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.ios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  AuroraPacketTunnel_iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: SharedNetworkExtension
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
    dependencies:
      - target: AuroraKit_iOS
    entitlements:
      path: SharedNetworkExtension/AuroraPacketTunnel-iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: SharedNetworkExtension/Info-iOS.plist
      properties:
        CFBundleDisplayName: Aurora Packet Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.ios.packet-tunnel
        PRODUCT_NAME: AuroraPacketTunnel
        PRODUCT_MODULE_NAME: AuroraPacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
  AuroraMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
    dependencies:
      - target: AuroraUI_macOS
      - target: AuroraPacketTunnel_macOS
        embed: true
        codeSign: true
    entitlements:
      path: Apps/macOS/AuroraMac.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.macos
  AuroraPacketTunnel_macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: SharedNetworkExtension
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
    dependencies:
      - target: AuroraKit_macOS
    entitlements:
      path: SharedNetworkExtension/AuroraPacketTunnel-macOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: SharedNetworkExtension/Info-macOS.plist
      properties:
        CFBundleDisplayName: Aurora Packet Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora-protocol.aurora.macos.packet-tunnel
        PRODUCT_NAME: AuroraPacketTunnel
        PRODUCT_MODULE_NAME: AuroraPacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  AuroraIOS:
    build:
      targets:
        AuroraIOS: all
  AuroraPacketTunnel_iOS:
    build:
      targets:
        AuroraPacketTunnel_iOS: all
  AuroraMac:
    build:
      targets:
        AuroraMac: all
  AuroraPacketTunnel_macOS:
    build:
      targets:
        AuroraPacketTunnel_macOS: all

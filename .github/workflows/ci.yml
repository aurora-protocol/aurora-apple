name: CI

# This repository is public, so standard GitHub-hosted runners are free on
# every OS, macos-latest included. Push is scoped to main so a pull request
# branch does not fire this twice.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout aurora-apple
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: aurora-apple
          persist-credentials: false
      - name: Checkout aurora-core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Public sibling repo; the default token clones it without a secret.
          repository: aurora-protocol/aurora-core
          ref: fab82ba95e330e92576480cbfae88becbec1d985
          path: aurora-core
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: aurora-core/go.mod
          cache-dependency-path: aurora-core/go.sum
      - name: Check Apple package and app targets
        working-directory: aurora-apple
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
        run: scripts/aurora-apple-check.sh

name: CI

# macOS runners are billed even for public repositories, so this workflow
# must never trigger automatically. The merge gate for aurora-apple is the
# local run of scripts/aurora-apple-check.sh; this workflow exists only for
# an operator-triggered spot check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout aurora-apple
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: aurora-apple
          persist-credentials: false
      - name: Checkout aurora-core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Public sibling repo; the default token clones it without a secret.
          repository: aurora-protocol/aurora-core
          ref: c2d9ac7758058c002aaac1e804ac677382c2c520
          path: aurora-core
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: aurora-core/go.mod
          cache-dependency-path: aurora-core/go.sum
      - name: Check Apple package and app targets
        working-directory: aurora-apple
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
        run: scripts/aurora-apple-check.sh

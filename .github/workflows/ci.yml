name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - name: Checkout aurora-apple
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: aurora-apple
          persist-credentials: false
      - name: Checkout aurora-core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Public sibling repo; the default token clones it without a secret.
          repository: aurora-protocol/aurora-core
          ref: a312b8d7949436f8f8550063c6f5154a333dfe12
          path: aurora-core
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: aurora-core/go.mod
          cache-dependency-path: aurora-core/go.sum
      - name: Check Apple package and app targets
        working-directory: aurora-apple
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
          AURORA_REQUIRE_SIGNED_SEED_TRUST: "1"
        run: |
          scripts/write-test-native-trust-resource.sh
          scripts/aurora-apple-check.sh

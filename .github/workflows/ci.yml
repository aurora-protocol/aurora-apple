name: CI

on:
  push:
  pull_request:

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - name: Checkout aurora-apple
        uses: actions/checkout@v5
        with:
          path: aurora-apple
      - name: Checkout aurora-core
        uses: actions/checkout@v5
        with:
          repository: aurora-protocol/aurora-core
          path: aurora-core
          # Private sibling repo: provide a token with read access.
          token: ${{ secrets.AURORA_CORE_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check Apple package and app targets
        working-directory: aurora-apple
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
        run: scripts/aurora-apple-check.sh
